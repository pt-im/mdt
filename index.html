<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro · Grid · Actions · Telegram & Safew</title>
    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            background: #0b0b1a;
        }

        /* ── all screens overlay each other ── */
        .screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            transition: opacity 0.9s cubic-bezier(0.23, 1, 0.32, 1),
                visibility 0.9s cubic-bezier(0.23, 1, 0.32, 1),
                transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
            visibility: hidden;
            opacity: 0;
            z-index: 1;
            transform: scale(0.96) rotateX(2deg);
            will-change: transform, opacity;
        }

        .screen.active {
            visibility: visible;
            opacity: 1;
            z-index: 2;
            transform: scale(1) rotateX(0deg);
        }

        /* ───────────── INTRO SCREEN (vertical) ───────────── */
        #intro-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0b0b1a 100%);
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }

        /* floating particles */
        #intro-screen .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        #intro-screen .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        #intro-screen .welcome-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.8rem;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 1;
        }

        #intro-screen .welcome-item {
            text-align: center;
            font-size: clamp(2.8rem, 10vw, 5.5rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 0.2rem 0.5rem;
            width: 100%;
            opacity: 0;
            transform: translateY(60px) scale(0.9);
            animation: introReveal 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            will-change: transform, opacity;
            position: relative;
        }
        #intro-screen .welcome-item:nth-child(1) {
            animation-delay: 0.1s;
            color: #f0f0f0;
        }
        #intro-screen .welcome-item:nth-child(2) {
            animation-delay: 0.25s;
            color: #ffd700;
        }
        #intro-screen .welcome-item:nth-child(3) {
            animation-delay: 0.4s;
            color: #6dd5ed;
        }
        #intro-screen .welcome-item:nth-child(4) {
            animation-delay: 0.55s;
            color: #ff6b6b;
        }

        #intro-screen .welcome-item .lang-label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.35;
            margin-top: 0.2rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            transform: scale(0.8);
            animation: labelPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: inherit;
        }

        @keyframes introReveal {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.9) blur(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) blur(0);
            }
        }
        @keyframes labelPop {
            0% {
                opacity: 0;
                transform: scale(0.6);
            }
            100% {
                opacity: 0.35;
                transform: scale(1);
            }
        }

        #intro-screen .click-hint {
            margin-top: 2.5rem;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 300;
            animation: pulseHint 2.8s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }
        @keyframes pulseHint {
            0%,
            100% {
                opacity: 0.2;
                transform: translateY(0);
            }
            50% {
                opacity: 0.7;
                transform: translateY(-4px);
            }
        }

        @media (max-width: 600px) {
            #intro-screen .welcome-stack {
                gap: 1.2rem;
                padding: 1rem;
            }
            #intro-screen .welcome-item {
                font-size: clamp(2.2rem, 14vw, 3.8rem);
            }
        }

        /* ───────────── GRID SCREEN (2×2 squares) ───────────── */
        #grid-screen {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            background: #0b0b1a;
            perspective: 1200px;
        }

        #grid-screen .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: lowercase;
            cursor: pointer;
            user-select: none;
            border: 2px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                filter 0.3s ease,
                box-shadow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: transform;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        #grid-screen .square .glow {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            top: -50%;
            left: -50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            will-change: opacity;
        }
        #grid-screen .square:hover .glow {
            opacity: 1;
        }

        #grid-screen .square .label-wrap {
            position: relative;
            z-index: 2;
            display: inline-block;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #grid-screen .square:hover .label-wrap {
            transform: scale(1.06) translateZ(20px);
        }

        #grid-screen .square .shimmer {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(135deg,
                    transparent 30%,
                    rgba(255, 255, 255, 0.05) 50%,
                    transparent 70%);
            transform: rotate(25deg) translateX(-100%);
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
        }
        #grid-screen .square:hover .shimmer {
            transform: rotate(25deg) translateX(100%);
        }

        #grid-screen .square:nth-child(1) {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        #grid-screen .square:nth-child(2) {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #2d2d2d;
            text-shadow: 0 2px 15px rgba(255, 255, 255, 0.15);
        }
        #grid-screen .square:nth-child(3) {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.25);
        }
        #grid-screen .square:nth-child(4) {
            background: linear-gradient(135deg, #cb2d3e, #ef473a);
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        #grid-screen .square::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        #grid-screen .square .corner-glow {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 0;
        }
        #grid-screen .square:hover .corner-glow {
            opacity: 0.3;
            transform: scale(1.5);
        }

        @media (max-width: 600px) {
            #grid-screen .square {
                font-size: clamp(1.5rem, 10vw, 3rem);
            }
        }

        /* ───────────── ACTION SCREEN (3 vertical rectangles) ───────────── */
        #action-screen {
            display: flex;
            flex-direction: column;
            background: #0b0b1a;
            perspective: 1000px;
        }

        #action-screen .action-rect {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: lowercase;
            cursor: pointer;
            user-select: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                filter 0.3s ease;
            will-change: transform;
            transform-style: preserve-3d;
        }

        #action-screen .action-rect:last-child {
            border-bottom: none;
        }

        #action-screen .action-rect .ink {
            position: absolute;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: width 0.7s cubic-bezier(0.23, 1, 0.32, 1),
                height 0.7s cubic-bezier(0.23, 1, 0.32, 1),
                opacity 0.5s ease;
            opacity: 0;
            will-change: width, height;
        }
        #action-screen .action-rect:hover .ink {
            width: 600px;
            height: 600px;
            opacity: 0.5;
        }

        #action-screen .action-rect .label-wrap {
            position: relative;
            z-index: 2;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #action-screen .action-rect:hover .label-wrap {
            transform: scale(1.05) translateZ(15px);
        }

        #action-screen .action-rect .shimmer-line {
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.04) 50%,
                    transparent);
            transform: skewX(-20deg);
            transition: left 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
        }
        #action-screen .action-rect:hover .shimmer-line {
            left: 150%;
        }

        #action-screen .action-rect:nth-child(1) {
            background: linear-gradient(135deg, #0f3443, #34e89e);
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        #action-screen .action-rect:nth-child(2) {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.25);
        }
        #action-screen .action-rect:nth-child(3) {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.25);
        }

        #action-screen .action-rect::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        @media (max-width: 600px) {
            #action-screen .action-rect {
                font-size: clamp(1.8rem, 10vw, 3.5rem);
            }
        }

        /* ───────────── SPLIT SCREEN (Telegram / Safew) ───────────── */
        #split-screen {
            display: flex;
            flex-direction: column;
            background: #0b0b1a;
            overflow: hidden;
        }

        #split-screen .half-link {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            transition: flex 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                filter 0.3s ease;
            will-change: transform;
            overflow: hidden;
        }

        #split-screen .half-link .bg-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                    rgba(255, 255, 255, 0.08) 0%,
                    transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        #split-screen .half-link:hover .bg-glow {
            opacity: 1;
        }

        #split-screen .half-link .label {
            font-size: clamp(4rem, 18vw, 10rem);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: lowercase;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                text-shadow 0.4s ease;
            position: relative;
            z-index: 2;
            will-change: transform;
        }

        #split-screen .half-link .label .char {
            display: inline-block;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                color 0.4s ease;
            will-change: transform;
        }
        #split-screen .half-link:hover .label .char {
            transform: translateY(-6px) scale(1.05);
        }
        #split-screen .half-link:hover .label .char:nth-child(odd) {
            transform: translateY(-6px) rotate(-2deg) scale(1.05);
        }
        #split-screen .half-link:hover .label .char:nth-child(even) {
            transform: translateY(-6px) rotate(2deg) scale(1.05);
        }

        #split-screen .half-link.top {
            background: linear-gradient(145deg, #0088ff, #0055cc);
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
        }
        #split-screen .half-link.top .label {
            color: #ffffff;
            text-shadow: 0 4px 40px rgba(0, 0, 0, 0.2);
        }
        #split-screen .half-link.top .label .char:hover {
            color: #ffd700;
        }

        #split-screen .half-link.top::after {
            content: "✈";
            position: absolute;
            bottom: 1.2rem;
            right: 2rem;
            font-size: 2rem;
            opacity: 0.15;
            transform: rotate(20deg) scale(0.8);
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                opacity 0.4s ease;
        }
        #split-screen .half-link.top:hover::after {
            transform: rotate(20deg) scale(1.2);
            opacity: 0.3;
        }

        #split-screen .half-link.bottom {
            background: linear-gradient(145deg, #ff6b9d, #c44569);
            border-top: 2px solid rgba(255, 255, 255, 0.06);
        }
        #split-screen .half-link.bottom .label {
            color: #4a4a4a;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
        }
        #split-screen .half-link.bottom .label .char:hover {
            color: #ffffff;
        }

        #split-screen .half-link.bottom::after {
            content: "🔒";
            position: absolute;
            top: 1.2rem;
            right: 2rem;
            font-size: 2rem;
            opacity: 0.15;
            color: rgba(0, 0, 0, 0.25);
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                opacity 0.4s ease;
        }
        #split-screen .half-link.bottom:hover::after {
            transform: scale(1.3) rotate(10deg);
            opacity: 0.35;
        }

        #split-screen .half-link:hover {
            filter: brightness(1.06);
            flex: 1.08;
        }

        #split-screen .divider {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.3) 20%,
                    rgba(255, 255, 255, 0.7) 50%,
                    rgba(255, 255, 255, 0.3) 80%,
                    transparent);
            z-index: 5;
            pointer-events: none;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }
        #split-screen .divider::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 8px;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(8px);
            animation: pulseGlow 2.8s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% {
                opacity: 0.3;
                width: 80px;
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                width: 220px;
                filter: blur(10px);
            }
        }

        /* floating orbs on split */
        #split-screen .orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(60px);
            opacity: 0.08;
            animation: orbFloat 12s ease-in-out infinite alternate;
            z-index: 0;
        }
        #split-screen .orb-1 {
            width: 300px;
            height: 300px;
            background: #0088ff;
            top: 10%;
            left: -5%;
            animation-delay: 0s;
        }
        #split-screen .orb-2 {
            width: 400px;
            height: 400px;
            background: #ff6b9d;
            bottom: 10%;
            right: -8%;
            animation-delay: 3s;
        }
        #split-screen .orb-3 {
            width: 200px;
            height: 200px;
            background: #ffd700;
            top: 40%;
            left: 30%;
            animation-delay: 6s;
            opacity: 0.04;
        }
        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -40px) scale(1.2);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.9);
            }
            100% {
                transform: translate(10px, -20px) scale(1.1);
            }
        }

        @media (max-width: 600px) {
            #split-screen .half-link.top::after,
            #split-screen .half-link.bottom::after {
                display: none;
            }
            #split-screen .half-link.top .label,
            #split-screen .half-link.bottom .label {
                font-size: clamp(3rem, 14vw, 5rem);
            }
            #split-screen .orb {
                display: none;
            }
        }

        /* ── prefers-reduced-motion ── */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            #intro-screen .welcome-item {
                opacity: 1;
                transform: none;
                animation: none;
            }
            .screen {
                transition: none;
            }
            #intro-screen .particle {
                display: none;
            }
        }

        /* ── accessibility focus ── */
        #split-screen .half-link:focus-visible,
        #grid-screen .square:focus-visible,
        #action-screen .action-rect:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.8);
            outline-offset: -6px;
            z-index: 10;
        }
        #intro-screen:focus-visible {
            outline: none;
        }
    </style>
</head>
<body>

    <!-- ─── INTRO SCREEN (vertical welcome) ─── -->
    <div id="intro-screen" class="screen active" tabindex="0" role="button" aria-label="Click to continue">
        <!-- floating particles -->
        <div class="particles" id="particles"></div>

        <div class="welcome-stack">
            <div class="welcome-item">
                Welcome
                <span class="lang-label">English</span>
            </div>
            <div class="welcome-item">
                Bienvenido
                <span class="lang-label">Español</span>
            </div>
            <div class="welcome-item">
                Bem‑vindo
                <span class="lang-label">Português</span>
            </div>
            <div class="welcome-item">
                欢迎
                <span class="lang-label">中文</span>
            </div>
        </div>
        <div class="click-hint">✦ click anywhere to explore ✦</div>
    </div>

    <!-- ─── GRID SCREEN (2×2 squares) ─── -->
    <div id="grid-screen" class="screen" aria-hidden="true">
        <div class="square" tabindex="0" role="button" aria-label="Deviant Art">
            <span class="corner-glow" style="top:-20px;right:-20px;background:rgba(100,150,255,0.3);"></span>
            <span class="corner-glow" style="bottom:-20px;left:-20px;background:rgba(255,200,100,0.2);"></span>
            <span class="shimmer"></span>
            <span class="glow"></span>
            <span class="label-wrap">Deviant Art</span>
        </div>
        <div class="square" tabindex="0" role="button" aria-label="Potato Chat">
            <span class="corner-glow" style="top:-20px;right:-20px;background:rgba(255,215,0,0.25);"></span>
            <span class="corner-glow" style="bottom:-20px;left:-20px;background:rgba(255,150,50,0.2);"></span>
            <span class="shimmer"></span>
            <span class="glow"></span>
            <span class="label-wrap">Potato Chat</span>
        </div>
        <div class="square" tabindex="0" role="button" aria-label="keet io">
            <span class="corner-glow" style="top:-20px;right:-20px;background:rgba(50,255,150,0.25);"></span>
            <span class="corner-glow" style="bottom:-20px;left:-20px;background:rgba(0,200,200,0.2);"></span>
            <span class="shimmer"></span>
            <span class="glow"></span>
            <span class="label-wrap">keet io</span>
        </div>
        <div class="square" tabindex="0" role="button" aria-label="matrix">
            <span class="corner-glow" style="top:-20px;right:-20px;background:rgba(255,80,80,0.25);"></span>
            <span class="corner-glow" style="bottom:-20px;left:-20px;background:rgba(200,50,200,0.2);"></span>
            <span class="shimmer"></span>
            <span class="glow"></span>
            <span class="label-wrap">matrix</span>
        </div>
    </div>

    <!-- ─── ACTION SCREEN (3 vertical rectangles) ─── -->
    <div id="action-screen" class="screen" aria-hidden="true">
        <div class="action-rect" tabindex="0" role="button" aria-label="Subscribe">
            <span class="shimmer-line"></span>
            <span class="ink" id="ink1"></span>
            <span class="label-wrap">subscribe</span>
        </div>
        <div class="action-rect" tabindex="0" role="button" aria-label="Shop now">
            <span class="shimmer-line"></span>
            <span class="ink" id="ink2"></span>
            <span class="label-wrap">shop now</span>
        </div>
        <div class="action-rect" tabindex="0" role="button" aria-label="Previews">
            <span class="shimmer-line"></span>
            <span class="ink" id="ink3"></span>
            <span class="label-wrap">previews</span>
        </div>
    </div>

    <!-- ─── SPLIT SCREEN (Telegram / Safew) ─── -->
    <div id="split-screen" class="screen" aria-hidden="true">
        <!-- floating orbs -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <div class="divider" aria-hidden="true"></div>

        <a href="https://t.me/Superhelpful" target="_blank" rel="noopener noreferrer" class="half-link top" aria-label="Telegram – opens in new tab">
            <span class="bg-glow"></span>
            <span class="label" id="telegram-label">telegram</span>
        </a>

        <a href="https://sfw.vc/superhelpful" target="_blank" rel="noopener noreferrer" class="half-link bottom" aria-label="Safew – opens in new tab">
            <span class="bg-glow"></span>
            <span class="label" id="safew-label">safew</span>
        </a>
    </div>

    <script>
        (function() {
            // ── particles ──
            (function createParticles() {
                const container = document.getElementById('particles');
                if (!container) return;
                for (let i = 0; i < 35; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = 2 + Math.random() * 4;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDuration = (12 + Math.random() * 20) + 's';
                    p.style.animationDelay = (Math.random() * 15) + 's';
                    p.style.opacity = 0.1 + Math.random() * 0.25;
                    container.appendChild(p);
                }
            })();

            // ── screen navigation ──
            const intro = document.getElementById('intro-screen');
            const grid = document.getElementById('grid-screen');
            const action = document.getElementById('action-screen');
            const split = document.getElementById('split-screen');
            const squares = document.querySelectorAll('#grid-screen .square');
            const rects = document.querySelectorAll('#action-screen .action-rect');

            function switchTo(screenId) {
                [intro, grid, action, split].forEach(el => {
                    el.classList.remove('active');
                    el.setAttribute('aria-hidden', 'true');
                });
                const target = document.getElementById(screenId);
                if (target) {
                    target.classList.add('active');
                    target.removeAttribute('aria-hidden');
                    if (screenId === 'grid-screen') {
                        const first = target.querySelector('.square');
                        if (first) first.focus();
                    } else if (screenId === 'action-screen') {
                        const first = target.querySelector('.action-rect');
                        if (first) first.focus();
                    } else if (screenId === 'split-screen') {
                        const first = target.querySelector('.half-link');
                        if (first) first.focus();
                    } else if (screenId === 'intro-screen') {
                        target.focus();
                    }
                }
            }

            // Intro → Grid
            intro.addEventListener('click', () => switchTo('grid-screen'));
            intro.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    switchTo('grid-screen');
                }
            });

            // Grid squares → Action
            squares.forEach(sq => {
                sq.addEventListener('click', (e) => {
                    e.stopPropagation();
                    switchTo('action-screen');
                });
                sq.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        switchTo('action-screen');
                    }
                });
            });

            // Action rectangles → Split
            rects.forEach(rect => {
                rect.addEventListener('click', (e) => {
                    e.stopPropagation();
                    switchTo('split-screen');
                });
                rect.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        switchTo('split-screen');
                    }
                });
            });

            // ── 3D Tilt on Grid Squares ──
            squares.forEach(sq => {
                sq.addEventListener('mousemove', (e) => {
                    const rect = sq.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;
                    const rotateX = y * -12;
                    const rotateY = x * 12;
                    sq.style.transform =
                        `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
                });
                sq.addEventListener('mouseleave', () => {
                    sq.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) scale(1)';
                });
            });

            // ── Ink effect on action rectangles ──
            rects.forEach((rect, idx) => {
                const ink = rect.querySelector('.ink');
                rect.addEventListener('mousemove', (e) => {
                    const r = rect.getBoundingClientRect();
                    const x = e.clientX - r.left;
                    const y = e.clientY - r.top;
                    ink.style.left = x + 'px';
                    ink.style.top = y + 'px';
                });
                rect.addEventListener('mouseenter', () => {
                    ink.style.opacity = '1';
                });
                rect.addEventListener('mouseleave', () => {
                    ink.style.opacity = '0';
                    ink.style.width = '0';
                    ink.style.height = '0';
                    setTimeout(() => {
                        ink.style.width = '0';
                        ink.style.height = '0';
                    }, 50);
                });
                // actually trigger the expansion on hover
                rect.addEventListener('mouseenter', () => {
                    setTimeout(() => {
                        ink.style.width = '600px';
                        ink.style.height = '600px';
                    }, 10);
                });
            });

            // ── Split screen glow follows mouse ──
            const halfLinks = document.querySelectorAll('#split-screen .half-link');
            halfLinks.forEach(link => {
                link.addEventListener('mousemove', (e) => {
                    const rect = link.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width * 100);
                    const y = ((e.clientY - rect.top) / rect.height * 100);
                    link.style.setProperty('--mouse-x', x + '%');
                    link.style.setProperty('--mouse-y', y + '%');
                    const glow = link.querySelector('.bg-glow');
                    if (glow) {
                        glow.style.opacity = '1';
                    }
                });
                link.addEventListener('mouseleave', () => {
                    const glow = link.querySelector('.bg-glow');
                    if (glow) {
                        glow.style.opacity = '0';
                    }
                });
            });

            // ── Split text character animation ──
            function splitTextIntoChars(selector) {
                const el = document.querySelector(selector);
                if (!el) return;
                const text = el.textContent;
                el.innerHTML = '';
                text.split('').forEach((char, i) => {
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = char === ' ' ? '\u00A0' : char;
                    span.style.transitionDelay = (i * 15) + 'ms';
                    el.appendChild(span);
                });
            }
            // wait for DOM
            setTimeout(() => {
                splitTextIntoChars('#telegram-label');
                splitTextIntoChars('#safew-label');
            }, 100);

            // ── set initial aria states ──
            intro.setAttribute('aria-hidden', 'false');
            grid.setAttribute('aria-hidden', 'true');
            action.setAttribute('aria-hidden', 'true');
            split.setAttribute('aria-hidden', 'true');

            console.log('✨ Motion-rich experience loaded.');
        })();
    </script>

</body>
</html>
